# Alternative local cluster with Docker and kind (not run). The cluster that
# was run is k3s in WSL2: deploy/k3s/README.md, evidence in results/k8s/.
# kind's default node image is Kubernetes 1.30+, which
# deploy/k8s/10-model-pool.yaml needs.
#   kind create cluster --config deploy/kind/kind-config.yaml
#   docker build -t tenantscaler:dev .
#   kind load docker-image tenantscaler:dev --name tenantscaler
#   kubectl apply -f deploy/k8s/00-namespace.yaml -f deploy/k8s/01-crd.yaml
#   kubectl wait --for=condition=Established crd/tenantscalers.scaling.tenantscaler.dev
#   kubectl -n tenantscaler create secret generic tenantscaler-keys --from-env-file=<key env file>
#   kubectl apply -f deploy/k8s/
#   kubectl -n tenantscaler port-forward svc/gateway 18080:8080
#   kubectl -n tenantscaler port-forward svc/tenantscaler-controller 18090:8090
#   kubectl -n tenantscaler get tenantscalers
apiVersion: kind.x-k8s.io/v1alpha4
kind: Cluster
name: tenantscaler
nodes:
  - role: control-plane
  - role: worker
