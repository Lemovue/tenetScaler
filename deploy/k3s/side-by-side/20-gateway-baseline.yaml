# SIDE BY SIDE: the baseline's gateway, the passthrough gateway of
# deploy/k8s/baselines/gateway-passthrough.yaml in front of
# model-pool-baseline. It forwards every request at once, so requests queue
# FCFS inside the replicas, with no notion of tenants. It gets the same keys
# as the TenantScaler gateway (Secret tenantscaler-keys) and reads the same
# tenants (the TenantScalers; gateway-config as fallback), so a request
# mirrored to it is accepted and measured per tenant.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway-baseline
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: gateway-baseline
    app.kubernetes.io/part-of: tenantscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway-baseline
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway-baseline
        app.kubernetes.io/part-of: tenantscaler
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: tenantscaler:dev
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - -addr
            - :8080
            - -config
            - /etc/tenantscaler/config.yaml
            - -mode
            - passthrough
            - -namespace
            - tenantscaler
            - -k8s-service
            - model-pool-baseline
            - -k8s-port
            - "8000"
          env:
            - name: TS_TENANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_TENANT_KEYS
            - name: TS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_ADMIN_KEY
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/tenantscaler
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
---
apiVersion: v1
kind: Service
metadata:
  name: gateway-baseline
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: gateway-baseline
    app.kubernetes.io/part-of: tenantscaler
spec:
  selector:
    app.kubernetes.io/name: gateway-baseline
  ports:
    - name: http
      port: 8080
      targetPort: http
