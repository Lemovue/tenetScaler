# BASELINE gateway: the Deployment from 20-gateway.yaml with -mode passthrough
# and nothing else changed (internal/k8s tests enforce that). The baselines
# (hpa-cpu.yaml, keda-scaledobject.yaml) need it, as in the simulated S1/S2
# setups. A passthrough gateway forwards every request at once, so requests
# queue FCFS at the replicas, like a plain Service. Without it the fair
# gateway would hold the backlog in its own queue, the replicas'
# vllm:num_requests_waiting would stay 0, and KEDA would never scale up.
# Applying it also restarts the gateway, which drops the last controller
# policy (a tenant shed under that policy would otherwise keep getting 429s).
#   kubectl apply -f deploy/k8s/baselines/gateway-passthrough.yaml
# Back to TenantScaler:
#   kubectl apply -f deploy/k8s/20-gateway.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: tenantscaler
  labels:
    app.kubernetes.io/name: gateway
    app.kubernetes.io/part-of: tenantscaler
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gateway
        app.kubernetes.io/part-of: tenantscaler
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: gateway
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: gateway
          image: tenantscaler:dev
          imagePullPolicy: IfNotPresent
          args:
            - gateway
            - -addr
            - :8080
            - -config
            - /etc/tenantscaler/config.yaml
            - -mode
            - passthrough
            - -namespace
            - tenantscaler
            - -k8s-service
            - model-pool
            - -k8s-port
            - "8000"
          env:
            - name: TS_TENANT_KEYS
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_TENANT_KEYS
            - name: TS_ADMIN_KEY
              valueFrom:
                secretKeyRef:
                  name: tenantscaler-keys
                  key: TS_ADMIN_KEY
          ports:
            - name: http
              containerPort: 8080
          volumeMounts:
            - name: config
              mountPath: /etc/tenantscaler
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
          resources:
            requests:
              cpu: 200m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: gateway-config
